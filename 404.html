<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada | PSL Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #145C46;
      --primary-dark: #0D3E2F;
      --primary-light: #EBF5F1;
      --gray-900: #111827;
      --gray-600: #4B5563;
      --gray-400: #9CA3AF;
      --gray-100: #F3F4F6;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FAFAFA;
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--white);
      border: 1px solid #E5E7EB;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEE2E2;
      color: #991B1B;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 56px;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -1.5px;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-outline {
      background: var(--white);
      color: var(--primary);
      border: 1px solid #D1D5DB;
    }
    .btn-outline:hover {
      background: var(--primary-light);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="margin-bottom: 24px; text-align: center;">
      <img src="/brand/logo_transparent.png" onerror="this.onerror=null; this.src='/logo.png';" alt="PSL Labs" style="height: 52px; width: auto; max-width: 220px;">
    </div>
    <div class="badge">Erro 404</div>
    <h1>404</h1>
    <h2>Página Não Encontrada</h2>
    <p>O link que você tentou acessar não existe ou foi atualizado. Navegue pelo nosso catálogo oficial de peptídeos ou acesse o painel gerencial.</p>
    
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Ir para o Catálogo de Peptídeos
      </a>
      <a href="/admin" class="btn btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Acessar Painel ADM
      </a>
    </div>

    <div class="footer-note">
      PSL Labs · Premium Synthesis Line · Pureza Farmacêutica >99%
    </div>
  </div>
</body>
</html>
